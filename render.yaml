# One-click public demo on Render's free plan (no card needed):
#   https://render.com/deploy?repo=https://github.com/Shivasaireddy007/shopping_cart_system
# One container runs the API and serves the web app, on free PostgreSQL and Redis. Kafka and
# OpenSearch don't fit the free plan, so search uses its PostgreSQL fallback and events are
# recorded in the outbox but not relayed. Payments are simulated. The full stack runs with
# Docker Compose or Kubernetes (see README).
services:
  - type: web
    name: shopping-cart
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopping-cart-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: shopping-cart-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: keyvalue
    name: shopping-cart-cache
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: shopping-cart-db
    plan: free
    region: singapore
    databaseName: shop
    user: shop
    ipAllowList: []
