# Render blueprint for the public demo: https://render.com/docs/blueprint-spec
# Secrets marked "sync: false" are entered in the Render dashboard, never committed.
services:
  - type: web
    name: shopping-cart-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/categories
    envVars:
      - key: APP_NAME
        value: Shopping Cart
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr

      # MySQL (Aiven free tier)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_CA_CERT
        sync: false

      # Redis (Upstash free tier, which only has database 0)
      - key: REDIS_URL
        sync: false
      - key: REDIS_CLIENT
        value: predis
      - key: REDIS_CACHE_DB
        value: "0"
      - key: REDIS_SESSION_DB
        value: "0"
      - key: CACHE_DRIVER
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: SESSION_CONNECTION
        value: session

      # No background worker on the free plan; Elasticsearch and Shiprocket are off for the demo.
      - key: QUEUE_CONNECTION
        value: sync
      - key: ELASTICSEARCH_ENABLED
        value: "false"

      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
