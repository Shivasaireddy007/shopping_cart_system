name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      opensearch:
        image: opensearchproject/opensearch:3.3.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -fs http://localhost:9200/_cluster/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

      kafka:
        image: apache/kafka:4.1.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=15

    env:
      DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/shop_test
      REDIS_URL: redis://127.0.0.1:6379/15
      OPENSEARCH_TEST_URL: http://127.0.0.1:9200
      KAFKA_TEST_BOOTSTRAP: 127.0.0.1:9092

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type-check
        run: uv run mypy app

      - name: Apply migrations and check they match the models
        run: uv run alembic upgrade head && uv run alembic check

      - name: Test
        run: uv run pytest -q -rs

      - name: Check the committed OpenAPI spec is current
        run: |
          uv run python -m app.export_openapi /tmp/openapi.json
          diff -u ../docs/openapi.json /tmp/openapi.json || (echo "Run: uv run python -m app.export_openapi ../docs/openapi.json" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated API types are current
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  stack:
    # Builds the images, runs the whole stack with Docker Compose (payment and shipping
    # providers stubbed), then smoke-tests it and runs the Playwright purchase journey.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: |
          $COMPOSE up --build --detach
          for i in $(seq 1 120); do
            curl -fsS http://localhost:8080/api/v1/categories > /dev/null 2>&1 && exit 0
            sleep 3
          done
          echo "API never became ready" && exit 1

      - name: Seed demo data and build the search index
        run: |
          $COMPOSE run --rm api python -m app.seed --products 300
          $COMPOSE run --rm api python -m app.jobs.reindex

      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:8080

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium

      - name: End-to-end purchase journey
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Show logs on failure
        if: failure()
        run: $COMPOSE logs --tail=80

      - name: Stop the stack
        if: always()
        run: $COMPOSE down --volumes

  kubernetes:
    # Installs the Helm chart into a real Kubernetes cluster (kind) and smoke-tests it.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Lint and validate the chart
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm lint deploy/helm/shopping-cart
          helm template shop deploy/helm/shopping-cart | ./kubeconform -strict -summary -kubernetes-version 1.31.0 -
          helm template shop deploy/helm/shopping-cart -f deploy/kind/values.yaml | ./kubeconform -strict -summary -kubernetes-version 1.31.0 -

      - uses: helm/kind-action@v1
        with:
          cluster_name: shop

      - name: Build images and load them into the cluster
        run: |
          docker build -t shopping-cart-api:ci backend
          docker build -t shopping-cart-web:ci frontend
          kind load docker-image shopping-cart-api:ci shopping-cart-web:ci --name shop

      - name: Start PostgreSQL, Redis, OpenSearch and Kafka in the cluster
        run: |
          kubectl apply -f deploy/kind/dependencies.yaml
          kubectl wait --for=condition=available deployment --all --timeout=300s

      - name: Install the chart (runs the migration hook first)
        run: helm install shop deploy/helm/shopping-cart -f deploy/kind/values.yaml --wait --timeout 10m

      - name: Seed data and run the reindex CronJob once
        run: |
          kubectl exec deploy/shop-api -- python -m app.seed --products 300
          kubectl create job --from=cronjob/shop-reindex reindex-now
          kubectl wait --for=condition=complete job/reindex-now --timeout=180s

      - name: Smoke test through the web service
        run: |
          kubectl port-forward svc/shop-web 8080:80 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/ > /dev/null 2>&1 && break; sleep 1; done
          scripts/smoke-test.sh http://localhost:8080

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods | tail -120
          for d in $(kubectl get deploy -o name); do echo "== $d"; kubectl logs $d --tail=40 || true; done
