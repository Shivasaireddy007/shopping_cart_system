# Migrations run before every install or upgrade, so new code never meets an old schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shop.name" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "shop.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      {{- include "shop.podSecurity" . | nindent 6 }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.api }}:{{ .Values.image.tag }}"
          command: ["alembic", "upgrade", "head"]
          {{- include "shop.appEnv" . | nindent 10 }}
          {{- include "shop.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- range $name, $job := .Values.cronJobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "shop.name" $ }}-{{ $name }}
  labels: {{- include "shop.labels" $ | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          {{- include "shop.podSecurity" $ | nindent 10 }}
          restartPolicy: Never
          containers:
            - name: {{ $name }}
              image: "{{ $.Values.image.api }}:{{ $.Values.image.tag }}"
              command: {{- toYaml $job.command | nindent 16 }}
              {{- include "shop.appEnv" $ | nindent 14 }}
              {{- include "shop.containerSecurity" $ | nindent 14 }}
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: tmp, emptyDir: {} }
{{- end }}
